<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KOINO</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F3EDE2; color: #14120F; padding: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 420px; background: #FFFCF6; border: 1px solid #E9DFCF;
    border-radius: 26px; padding: 40px 32px 34px; text-align: center;
  }
  .wordmark { font-family: Georgia, "Times New Roman", serif; font-size: 19px; letter-spacing: 9px; margin-left: 9px; }
  .rule { width: 46px; height: 2px; background: #C2542F; border-radius: 2px; margin: 20px auto 0; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 28px; line-height: 36px; margin: 30px 0 0; letter-spacing: -0.3px; }
  p { font-size: 15px; line-height: 24px; color: #4A463E; margin: 14px 0 0; }
  a.button {
    display: inline-block; margin-top: 26px; background: #151310; color: #FBF7EF; text-decoration: none;
    font-size: 16px; font-weight: 600; padding: 16px 34px; border-radius: 15px;
  }
  .hint { margin-top: 18px; font-size: 12px; line-height: 19px; color: #8A8377; }
  .foot { margin-top: 26px; font-size: 12px; color: #B0A79A; letter-spacing: 0.2px; }
</style>
</head>
<body>
  <main class="card">
    <div class="wordmark">KOINO</div>
    <div class="rule"></div>
    <h1 id="title">Opening KOINO…</h1>
    <p id="body">Your password reset link is ready. If the app does not open by itself, use the button below.</p>
    <a class="button" id="open" href="#">Open KOINO</a>
    <div class="hint">The link works once and expires in one hour.</div>
    <div class="foot">A quiet place for Scripture, prayer and reflection.</div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get("oobCode") || params.get("oobcode") || "";
      if (!code) {
        var parts = location.pathname.split("/").filter(Boolean);
        var at = parts.indexOf("reset");
        if (at >= 0 && parts[at + 1]) code = decodeURIComponent(parts[at + 1]);
      }
      if (!code) {
        document.getElementById("title").textContent = "This link is incomplete";
        document.getElementById("body").textContent = "Open the newest reset email from KOINO and use its button. Links expire after one hour.";
        document.getElementById("open").style.display = "none";
        return;
      }
      var appUrl = "koino://reset-password?oobCode=" + encodeURIComponent(code);
      document.getElementById("open").setAttribute("href", appUrl);
      window.location.replace(appUrl);
    })();
  </script>
</body>
</html>
